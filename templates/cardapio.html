<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Monte seu Hambúrguer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style3.css') }}">
</head>
<body>
    <div class="login-container checkout-container">
        
        <h1>Monte seu Hambúrguer</h1>
        
        
        <form action="/cardapio" method="POST">
            <div class="checkbox-group">
                <input type="checkbox" id="pao" name="pao" checked>
                <label for="pao">{{ ingredientes.pao }}</label>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="carne" name="carne" checked>
                <label for="carne">{{ ingredientes.carne }}</label>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="queijo" name="queijo" checked>
                <label for="queijo">{{ ingredientes.queijo }}</label>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="salada" name="salada" checked>
                <label for="salada">Alface, tomate e cebola</label>
            </div>

            <div class="campo-endereco">
                <label for="endereco">Endereço de Entrega:</label>
                <input type="text" id="endereco" name="endereco" placeholder="Ex: Rua das Flores, 123 - Ap 42" required>
            </div>

            <button type="submit" class="btn-confirmar">
                Confirmar Pedido
            </button>
        </form>

        {% if resumo %}
            <div class="resumo-pedido">
                <h3>Seu Pedido Confirmado!</h3>
                <ul>
                    {% for item in resumo %}
                        <li>🍔 {{ item }}</li>
                    {% endfor %}
                </ul>
                
                {% if endereco %}
                    <hr>
                    <p>📍 <strong>Entregar em:</strong> {{ endereco }}</p>
                {% endif %}
            </div>
        {% endif %}

        <div class="signup-link link-sair">
            <a href="{{ url_for('login') }}">Sair</a>
        </div>

    </div>
</body>
</html>
